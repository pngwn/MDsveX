<!DOCTYPE html>
<html lang="en">
	<head>
		<meta content="width=device-width, initial-scale=1.0" name="viewport" />
		<meta charset="utf-8" />

		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbf8" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#15161b" />

		<link rel="manifest" href="/manifest.json" />
		<!-- the line bird, design/SCORE.md; the svg follows the reader's scheme -->
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

		<!-- Primary Meta Tags -->
		<meta name="title" content="mdsvex - svelte in markdown" />
		<meta
			name="description"
			content="Combine svelte and markdown in the same file. Live your dreams!"
		/>

		<!-- Open Graph / Facebook -->
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://mdsvex.com/" />
		<meta property="og:title" content="mdsvex - svelte in markdown" />
		<meta
			property="og:description"
			content="Combine svelte and markdown in the same file. Live your dreams!"
		/>
		<meta property="og:image" content="https://mdsvex.com/og.png" />

		<!-- Twitter -->
		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="https://mdsvex.com/" />
		<meta property="twitter:title" content="mdsvex - svelte in markdown" />
		<meta
			property="twitter:description"
			content="Combine svelte and markdown in the same file. Live your dreams!"
		/>
		<meta property="twitter:image" content="https://mdsvex.com/og.png" />

		%sveltekit.head%
	</head>

	<body>
		<div style="display: contents">%sveltekit.body%</div>

		<!-- Cloudflare Web Analytics, on the real site only: from localhost its
		     reports fail CORS and fill the console -->
		<script>
			if (!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
				const beacon = document.createElement("script");
				beacon.defer = true;
				beacon.src = "https://static.cloudflareinsights.com/beacon.min.js";
				beacon.dataset.cfBeacon = '{"token": "590d70c530b74f41b117351532dd6809"}';
				document.body.append(beacon);
			}
		</script>
	</body>
</html>
